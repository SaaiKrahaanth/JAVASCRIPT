<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promises</title>
</head>
<body>
    <script>
        /*SYNTAX*/
        let myPromises =new Promise(function(resolve,reject){
            let success=false;
            if(success){
                resolve("Success!");

            }else{
                reject("Error!");
            }
        });

      /*USAGE*/
      myPromises
      .then(function(result){
        console.log(result);
      })
      .catch(function(error){
        console.log(error);
    
      });

    </script>
    
</body>
</html>
