<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        
        function greet(name,callback) {
            console.log("hello "+name);
            
            document.write("hello "+name);
            callback(name);
            
        }
        function sayToSit(name){
            console.log("you can sit here"+name);
            document.write("you can sit here "+name);
        }
        greet("saai",sayToSit);

    </script>
    
</body>
</html>
