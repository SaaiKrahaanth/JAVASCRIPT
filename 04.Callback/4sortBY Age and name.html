<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const people = [
      { name: "Saai", age: 22 },
      { name: "Arun", age: 19 },
      { name: "Bala", age: 25 }
    ];
        function sortOrder(arr,callback){
            arr.sort(callback);
            return arr;
        }
        function sortAgeCallback(a,b){
                   return a.age-b.age;
        }
        function sortNameCallback(a,b){
            return a.name.localeCompare(b.name);
        }
        let AgeSortedjson= sortOrder(people,sortAgeCallback);
        AgeSortedjson.forEach(person => {console.log(person.name+" - "+person.age)});

        let NameSortedjson= sortOrder(people,sortNameCallback);
        NameSortedjson.forEach(person=>{console.log(person.name+" - "+person.age)});
            
        
    </script>
    
</body>
</html>
