            for(let i of arr){

                    res.push(i);
                }
            }

            document.writeln("Passed Marks: " + res);
        }

            }
            return false;
        }
        const passMRk=(i)=>i>75;
        score=[85,92,72,10,60];
        filterArray(score,passMRk);
